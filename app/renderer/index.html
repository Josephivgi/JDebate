<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src jdebate-preview:" />
    <title>JDebate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="side" aria-label="JDebate">
        <div class="brand">
          <img src="../assets/icon.png" alt="" />
          <span>JDebate</span>
        </div>
        <div class="nav" id="nav-pages"></div>
        <div class="nav-label" id="nav-open-label">Open battles</div>
        <div class="nav" id="nav-battles"></div>
        <div class="side-foot" id="side-foot"></div>
      </nav>
      <main id="main" tabindex="-1"></main>
    </div>
    <dialog id="new-dlg" aria-label="Open a battle"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
